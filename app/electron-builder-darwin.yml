productName: "SiYuan"
appId: "org.b3log.siyuan"
publish: null
asar: false
compression: "normal"
copyright: "© 2020-present Yunnan Liandi Technology Co., Ltd."
artifactName: "siyuan-${version}-${os}.${ext}"
extraMetadata:
  main: "electron/main.js"
directories:
  output: "build"
files:
  - "electron"
afterPack: "./scripts/afterPack.js"
extraFiles:
  - from: "../LICENSE"
    to: "Resources/LICENSE"
  - from: "../THIRD_PARTY_NOTICES.md"
    to: "Resources/THIRD_PARTY_NOTICES.md"

mac:
  identity: "Yunnan Liandi Technology Co., Ltd."
  provisioningProfile: "../../SiYuan.provisionprofile"
  icon: "src/assets/icon.icns"
  gatekeeperAssess: false
  hardenedRuntime: true
  entitlements: "../../entitlements.mas.plist"
  extendInfo:
    - NSMicrophoneUsageDescription: "This app requires microphone access to record audio."
  entitlementsInherit: "../../entitlements.mas.plist"
  minimumSystemVersion: "12.0.0"
  protocols:
    - name: "SiYuan"
      schemes:
        - "siyuan"
  extraResources:
    - from: "kernel-darwin"
      to: "kernel"
  target:
    - target: "dmg"
      arch: "x64"

extraResources:
  - from: "changelogs"
    to: "changelogs"
  - from: "stage"
    to: "stage"
  - from: "guide"
    to: "guide"
    filter: "!**/{.DS_Store,.git,.gitignore,.idea}"
  - from: "appearance/boot"
    to: "appearance/boot"
    filter: "!**/{.DS_Store}"
  - from: "appearance/covers"
    to: "appearance/covers"
    filter: "!**/{.DS_Store}"
  - from: "appearance/icons"
    to: "appearance/icons"
    filter:
      - "index.html"
      - "litheness/**/*"
  - from: "appearance/langs"
    to: "appearance/langs"
    filter: "!**/{.DS_Store}"
  - from: "appearance/emojis"
    to: "appearance/emojis"
    filter: "!**/{.DS_Store}"
  - from: "appearance/themes/midnight"
    to: "appearance/themes/midnight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/daylight"
    to: "appearance/themes/daylight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-mist"
    to: "appearance/themes/genway-mist"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-paper"
    to: "appearance/themes/genway-paper"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-ink"
    to: "appearance/themes/genway-ink"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-graphite"
    to: "appearance/themes/genway-graphite"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-aurora"
    to: "appearance/themes/genway-aurora"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-porcelain"
    to: "appearance/themes/genway-porcelain"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-meadow"
    to: "appearance/themes/genway-meadow"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-rose"
    to: "appearance/themes/genway-rose"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-obsidian"
    to: "appearance/themes/genway-obsidian"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-forest"
    to: "appearance/themes/genway-forest"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-ocean"
    to: "appearance/themes/genway-ocean"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/genway-ember"
    to: "appearance/themes/genway-ember"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/fonts"
    to: "appearance/fonts"
    filter: "!**/{.DS_Store}"
  - from: "pandoc/pandoc-darwin-amd64.zip"
    to: "pandoc.zip"
  - from: "pandoc/pandoc-resources"
    to: "pandoc-resources"
    filter: "!**/{.DS_Store}"
